name: indoor_nav_app
description: Indoor Navigation for Visually Impaired
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Camera & ML
  camera: ^0.10.5+5
  google_mlkit_object_detection: ^0.11.0
  
  # Audio & Haptics
  flutter_tts: ^3.8.5
  vibration: ^3.1.5
  
  # Sensors
  sensors_plus: ^4.0.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utils
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true